set timeout=0
set default=0

# Keep firmware/GRUB diagnostics visible on the same COM1 stream as the kernel.
insmod serial
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial

menuentry "NUN OS (QEMU bring-up)" {
    multiboot2 /boot/kernel.elf
    boot
}
