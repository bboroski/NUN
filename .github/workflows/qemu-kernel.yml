name: NUN QEMU kernel bring-up
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install boot and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils grub-pc-bin grub-common mtools xorriso qemu-system-x86
      - name: Build Multiboot2 image
        run: bash scripts/build-qemu.sh
      - name: Boot QEMU, check memory and interrupt handling, then ping over serial
        shell: bash
        run: |
          set +e
          { sleep 2; printf 'ping\n'; } | timeout 8s qemu-system-x86_64 -machine q35 -accel tcg -m 512M \
            -cdrom build/qemu/nun-qemu.iso -boot d -display none \
            -serial stdio -monitor none -no-reboot -no-shutdown \
            -d int,cpu_reset -D build/qemu/qemu.log \
            > build/qemu/serial.log 2>&1
          status=$?
          set -e
          echo "QEMU serial output:"
          cat build/qemu/serial.log
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "QEMU debug log:"
            cat build/qemu/qemu.log
            exit "$status"
          fi
          grep -F "NUN kernel: x86_64 entry reached" build/qemu/serial.log
          grep -F "NUN: usable physical pages below 1 GiB:" build/qemu/serial.log
          grep -F "NUN: physical memory self-test passed" build/qemu/serial.log
          grep -F "NUN: IDT installed; PIC remapped; PIT configured at 1000 Hz" build/qemu/serial.log
          grep -F "NUN Kernel Ready" build/qemu/serial.log
          grep -F "NUN: PIT interrupt received (1000 Hz)" build/qemu/serial.log
          grep -F "NUN: pong" build/qemu/serial.log
