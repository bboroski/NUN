name: NUN kernel foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make curl git binutils
      - name: Run allocator tests
        run: make check
      - name: Build freestanding kernel
        run: make kernel
      - name: Verify ELF metadata
        run: |
          readelf -h build/NUN.elf
          readelf -l build/NUN.elf
