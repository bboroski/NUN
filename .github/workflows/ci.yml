name: NUN integration CI

on:
  push:
    branches: [main, integration/all-repositories]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python test runner
        run: python -m pip install --upgrade pytest
      - name: Configure and run the full host integration
        run: python one.py
