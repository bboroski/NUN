name: Octopus Ippon Release — NUN

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: octopus-ippon-nun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build-release:
    name: Verify NUN targets and prepare release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install host, ISO and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc binutils make cmake python3             grub-pc-bin grub-common mtools xorriso qemu-system-x86 lld

      - name: Run host contract tests
        run: make test

      - name: Build Multiboot2 QEMU target
        run: bash scripts/build-qemu.sh

      - name: Boot the kernel and verify serial evidence
        shell: bash
        run: |
          set +e
          { sleep 2; printf 'ping\n'; } | timeout 8s qemu-system-x86_64 \
            -machine q35 -accel tcg -m 512M -cdrom build/qemu/nun-qemu.iso \
            -boot d -display none -serial stdio -monitor none -no-reboot -no-shutdown \
            -d int,cpu_reset -D build/qemu/qemu.log > build/qemu/serial.log 2>&1
          status=$?
          set -e
          cat build/qemu/serial.log
          test "$status" -eq 124 -o "$status" -eq 0
          grep -F "NUN kernel: x86_64 entry reached" build/qemu/serial.log
          grep -F "NUN: usable physical pages below 1 GiB:" build/qemu/serial.log
          grep -F "NUN: physical memory self-test passed" build/qemu/serial.log
          grep -F "NUN Kernel Ready" build/qemu/serial.log
          grep -F "NUN: pong" build/qemu/serial.log

      - name: Build the documented Limine ISO target
        run: make iso

      - name: Stage release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s build/NUN.iso
          test -s build/qemu/nun-qemu.iso
          cp build/NUN.iso dist/NUN.iso
          cp build/qemu/nun-qemu.iso dist/nun-qemu.iso
          sha256sum dist/NUN.iso dist/nun-qemu.iso > dist/SHA256SUMS

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/NUN.iso
            dist/nun-qemu.iso
            dist/SHA256SUMS

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: nun-release-evidence
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags only
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NUN ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

